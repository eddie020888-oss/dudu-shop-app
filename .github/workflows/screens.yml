name: Simulator screenshots
on:
  workflow_dispatch:   # 只手动跑
permissions:
  contents: write
jobs:
  shots:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)" && xcodebuild -version
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl create shots "iPhone 16 Pro")
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID"
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 || true
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build -project IslandMe.xcodeproj -scheme IslandMe \
            -destination "id=$UDID" -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Shoot
        run: |
          APP=$(ls -d build/dd/Build/Products/Debug-iphonesimulator/IslandMe.app)
          xcrun simctl install "$UDID" "$APP"
          BID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist")
          mkdir -p shots
          while read -r name args; do
            xcrun simctl terminate "$UDID" "$BID" 2>/dev/null || true
            case "$name" in
              app_*) xcrun simctl launch "$UDID" "$BID" $args ;;     # 真 App（不进小店演示）
              *) xcrun simctl launch "$UDID" "$BID" -demoKitchen $args ;;
            esac
            if [ "$name" = "selftest" ]; then
              for i in $(seq 1 60); do
                DATA=$(xcrun simctl get_app_container "$UDID" "$BID" data)
                [ -f "$DATA/Documents/selftest.txt" ] && break
                sleep 5
              done
              cp "$DATA/Documents/selftest.txt" shots/selftest.txt || echo "no report" > shots/selftest.txt
            else
              sleep 9
            fi
            xcrun simctl io "$UDID" screenshot "shots/$name.png"
          done < .github/screens-trigger
      - name: Publish to screens branch
        run: |
          cd shots
          git init -q && git checkout -q -b screens
          git config user.name "shots-bot" && git config user.email "shots@users.noreply.github.com"
          git add . && git commit -qm "screens for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" screens
