# 打包上传 TestFlight（手动点 Run workflow 才跑；公开仓库用 GitHub 的 macOS 机器免费）
# 需要的 Secrets（仓库 Settings → Secrets and variables → Actions）：
#   ASC_KEY_ID / ASC_ISSUER_ID / ASC_PRIVATE_KEY（App Store Connect API 密钥，权限「管理」）
#   CERT_PRIVATE_KEY（发布证书用的 RSA 私钥，第一次跑会用它在苹果后台建一张发布证书）
name: TestFlight
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.ASC_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERT_PRIVATE_KEY }}
      APP_ID: com.eddiejiang.islandme
      ASC_APP_ID: "6823709415"
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode (latest)
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)" && xcodebuild -version
      - name: Tools
        run: |
          brew install xcodegen
          pip3 install --break-system-packages codemagic-cli-tools pyjwt requests
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Bundle version
        run: |
          LATEST=$(app-store-connect get-latest-build-number "$ASC_APP_ID" 2>/dev/null || echo 0)
          NEXT=$((LATEST + 1)); [ "$NEXT" -lt 155 ] && NEXT=155
          echo "bundle version -> $NEXT (ASC latest=$LATEST)"
          agvtool new-version -all "$NEXT"
      - name: Signing (certificate + profiles from App Store Connect)
        run: |
          keychain initialize
          for id in "$APP_ID" "$APP_ID.widget"; do
            app-store-connect fetch-signing-files "$id" --type IOS_APP_STORE --create
          done
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        run: xcode-project build-ipa --project IslandMe.xcodeproj --scheme IslandMe
      - name: Show build errors
        if: failure()
        run: grep -hE "error:|Provisioning profile|entitlement" /tmp/xcodebuild_logs/*.log 2>/dev/null | sort -u | head -40 || true
      - name: Upload to App Store Connect
        run: app-store-connect publish --path "$(ls build/ios/ipa/*.ipa | head -1)"
